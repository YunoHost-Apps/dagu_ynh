#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.15.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.15.0/dagu_2.15.0_linux_amd64.tar.gz"
    amd64.sha256 = "7789fd5bf53101ff6442faf602ae404f3e64f438e982c86c57653277d93d1ad2"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.15.0/dagu_2.15.0_linux_arm64.tar.gz"
    arm64.sha256 = "a9426a580dbdaf4385d4528b717a83092d901e871ca455e9bf23a2a449b12fff"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.15.0/dagu_2.15.0_linux_armv7.tar.gz"
    armhf.sha256 = "823565b684d08dba9b1ebf5c48a2494e4cba3aeae7170fef47ba563618ec6ef7"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
