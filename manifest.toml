#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.13.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.13.0/dagu_2.13.0_linux_amd64.tar.gz"
    amd64.sha256 = "34b3b7471c9a1691bbad6938fc1bb7af6a2a87adfb42db9047984f3e2997ab55"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.13.0/dagu_2.13.0_linux_arm64.tar.gz"
    arm64.sha256 = "9a601125198f5ed070b8818bbac360f93cdf836470773eaf2671ec7f25b4ae5b"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.13.0/dagu_2.13.0_linux_armv7.tar.gz"
    armhf.sha256 = "e498bcbb906a522b0a40a787006744f636cc605ed7b0395f6dc7eea82188208b"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
