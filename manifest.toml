#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.17.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.17.0/dagu_2.17.0_linux_amd64.tar.gz"
    amd64.sha256 = "e9d4ac3c92f753439b40fc687e860acae4384d9692fb732e1285516811751e0d"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.17.0/dagu_2.17.0_linux_arm64.tar.gz"
    arm64.sha256 = "d81261ed98d4aeb7585d17755b3e94af10d2d61a5c15b5720d3305b86623a5cf"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.17.0/dagu_2.17.0_linux_armv7.tar.gz"
    armhf.sha256 = "a38a8689ae0f42473ad0d83690099bff7859db36ed76d1b1b115ed1a10079b69"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
