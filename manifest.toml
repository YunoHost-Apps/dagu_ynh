#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.15.2~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.15.2/dagu_2.15.2_linux_amd64.tar.gz"
    amd64.sha256 = "a6feed4b8db20cc86c4fe3a5e3e9451f86fc14e63ef9a04d0ea97d2899180ab3"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.15.2/dagu_2.15.2_linux_arm64.tar.gz"
    arm64.sha256 = "6f2316202df1549f535fab60af6c9fc8fdaf2e2d1a0c1cda4a8f85d05b93bb5e"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.15.2/dagu_2.15.2_linux_armv7.tar.gz"
    armhf.sha256 = "7d92e19c31be4e47a51c2f04b0cc48f714f98603f1556d005f9f53bfcceed433"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
