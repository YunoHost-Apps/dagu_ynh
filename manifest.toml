#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.7.10~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.10/dagu_2.7.10_linux_amd64.tar.gz"
    amd64.sha256 = "4eeac211281af72a4845870e3509c09c6a798243c7fc8a76fc848f6134d46a1b"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.10/dagu_2.7.10_linux_arm64.tar.gz"
    arm64.sha256 = "89229a5e79370a18cde5d0e5acec763a021174b51bb57fb8f235d91e98ac36f9"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.10/dagu_2.7.10_linux_armv7.tar.gz"
    armhf.sha256 = "d82bb1e70583672b3b0a67c688e0eb36ba26822e4ca680f58b2f0145e0fff1e8"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
