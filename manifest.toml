#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.11.3~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.3/dagu_2.11.3_linux_amd64.tar.gz"
    amd64.sha256 = "0035dd86125c1151eec393e2280ce107607bda78ce1e5496340a16713dda88f1"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.3/dagu_2.11.3_linux_arm64.tar.gz"
    arm64.sha256 = "8a63ea5e9ce494d02a97c838ae2cb12f82623120d033add9923044ca93f059d1"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.3/dagu_2.11.3_linux_armv7.tar.gz"
    armhf.sha256 = "0b544734d736b8fb6ec5c885ba2376c7d54a4515931cb2b3f23beca26002ca03"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
