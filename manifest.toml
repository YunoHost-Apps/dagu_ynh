#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.10.6~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.6/dagu_2.10.6_linux_amd64.tar.gz"
    amd64.sha256 = "771b8539a93f026d61c5606306d9c110b340a96b782329e2a0c413babe21521d"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.6/dagu_2.10.6_linux_arm64.tar.gz"
    arm64.sha256 = "bcc8dbc306883090a18654ce794fc60953251e78204dd9b62bbbc331e1fd9539"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.6/dagu_2.10.6_linux_armv7.tar.gz"
    armhf.sha256 = "8cf5be079a0ed5b61119d76669bdc539ef3720d8844a0faffbf3a0762ff2b9eb"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
