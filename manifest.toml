#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.10.1~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.1/dagu_2.10.1_linux_amd64.tar.gz"
    amd64.sha256 = "21dd28f1cdd57e5f8cd107bb2b346bf709aab353a041669326fc1c77a71ebcf7"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.1/dagu_2.10.1_linux_arm64.tar.gz"
    arm64.sha256 = "bee8282f804c131fc262eda338ac9dc0493987193d9186ed333569724e7a6194"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.1/dagu_2.10.1_linux_armv7.tar.gz"
    armhf.sha256 = "ae7756d004570f586f16201e85713ddfcc46a02a1f34405bcd2018190374f73d"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
