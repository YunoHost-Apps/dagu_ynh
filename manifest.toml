#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.16.3~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.3/dagu_2.16.3_linux_amd64.tar.gz"
    amd64.sha256 = "2237cdd6287db00857af3471bcad7cea0bf786055bbd24f1bc53a02ceb9d4b06"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.3/dagu_2.16.3_linux_arm64.tar.gz"
    arm64.sha256 = "e1f5fd611b003ee73e4846bad24455e02e052ff60314723e44aa067522c71762"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.3/dagu_2.16.3_linux_armv7.tar.gz"
    armhf.sha256 = "08c11727b4448941b1d256b7baebb5c1e2308b7503362be17af6aa30f004d7c7"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
