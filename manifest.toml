#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.7.15~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.15/dagu_2.7.15_linux_amd64.tar.gz"
    amd64.sha256 = "4acc65ba154299a41f81357335f8fd42c4fbd176dab2113551ab09645f09e472"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.15/dagu_2.7.15_linux_arm64.tar.gz"
    arm64.sha256 = "bbd69c7b6101a4a7e9048b2dfde0b18ab59cd495a0977fb7447b7d7ec7140ae8"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.15/dagu_2.7.15_linux_armv7.tar.gz"
    armhf.sha256 = "cc62c4ec423761ace3aeae30682ab3bde13f6a24997e93d73369604e6b627e32"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
