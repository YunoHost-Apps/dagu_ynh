#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.18.1~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.18.1/dagu_2.18.1_linux_amd64.tar.gz"
    amd64.sha256 = "69f5a0fc392d2c10630e68a1154e4a69b2c4ef6005ad753976dbc7057b1833b5"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.18.1/dagu_2.18.1_linux_arm64.tar.gz"
    arm64.sha256 = "78daba8cc9c303ec52ce848228cf431cc64b36fce540472eafea0ed19ea79354"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.18.1/dagu_2.18.1_linux_armv7.tar.gz"
    armhf.sha256 = "5e144c8bf56327444e0b346e73414ae425d3f508d3b97527dc9780ed1e28cf73"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
