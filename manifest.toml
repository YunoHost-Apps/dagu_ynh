#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.25.4~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.25.4/dagu_2.25.4_linux_amd64.tar.gz"
    amd64.sha256 = "ee56656ffbf88fb01f47f4bf06b7f4a37619f7149d95434d199f1246d4a1e608"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.25.4/dagu_2.25.4_linux_arm64.tar.gz"
    arm64.sha256 = "41c7c71440943f3625ed0f026a5cc23840fd13ce18fa65c3cdacbf04591a22ea"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.25.4/dagu_2.25.4_linux_armv7.tar.gz"
    armhf.sha256 = "b40b18d32470053de9383a7f68307f396dad4abdac8f9bcda9e67ed22b74aa69"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
