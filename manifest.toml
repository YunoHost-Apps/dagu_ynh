#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.11.4~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.4/dagu_2.11.4_linux_amd64.tar.gz"
    amd64.sha256 = "31be5a429ff1cc95320fdc39e5de4e97232159fd773ece181fb4519f5e564073"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.4/dagu_2.11.4_linux_arm64.tar.gz"
    arm64.sha256 = "b485c3582ffb2d9da35275fc01560d30878fa7e1d8a9e9eafcbff7744787e7d1"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.4/dagu_2.11.4_linux_armv7.tar.gz"
    armhf.sha256 = "0192cae2eaec322916e9c8a69791e4405336ce489b9c6b84d418523d688c7ab9"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
