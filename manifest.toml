#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.16.2~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.2/dagu_2.16.2_linux_amd64.tar.gz"
    amd64.sha256 = "4e9e5132accc31ec07af98b1c038751b8c9ea77e4fda583d881e562af75d2156"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.2/dagu_2.16.2_linux_arm64.tar.gz"
    arm64.sha256 = "f01a1f3eb79ca62d9caf9ab00e81f704725ea67300339624102bcb49d55476f3"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.2/dagu_2.16.2_linux_armv7.tar.gz"
    armhf.sha256 = "5f513746ba0ac8bfef3a51e3f3605f0ec517c9406cb5e01f8778ef2b87b3da36"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
