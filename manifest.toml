#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.11.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.0/dagu_2.11.0_linux_amd64.tar.gz"
    amd64.sha256 = "11c089c774a30eb49bc9a9504ee07d78235a0aa4c2aa6ddd5b455bf46149e39e"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.0/dagu_2.11.0_linux_arm64.tar.gz"
    arm64.sha256 = "143badb57e44ea1df401111fbf4945fe5c4bf203a7b87a63842b7f90e119a0cc"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.11.0/dagu_2.11.0_linux_armv7.tar.gz"
    armhf.sha256 = "2e4ac391bc9f6276b7773f324b9be1f38346733b5814c41d28730c58d55fd1ed"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
