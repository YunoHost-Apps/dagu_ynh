#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.10.5~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.5/dagu_2.10.5_linux_amd64.tar.gz"
    amd64.sha256 = "bb70eeb6d1a878210a2d191bf6d53192573c5d1f8c7c15eef1b41a7484472ccd"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.5/dagu_2.10.5_linux_arm64.tar.gz"
    arm64.sha256 = "33d073f13f35c05ba06da0824cb6f6980f7eea52bfd7dea6faed98611541a3fa"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.5/dagu_2.10.5_linux_armv7.tar.gz"
    armhf.sha256 = "df4620f649d359806a25fbe7b787710c117c8675a78e0ed21e96e96df18585ea"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
