#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.7.17~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.17/dagu_2.7.17_linux_amd64.tar.gz"
    amd64.sha256 = "f4b0f4117bc65942fba822945752cfc5fa7f378a2f5692d0666b0d887fc9ec39"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.17/dagu_2.7.17_linux_arm64.tar.gz"
    arm64.sha256 = "c1a7171d7fb726d0728b3062aed770c3a3459c4f705b6820825d5a4be55b0613"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.17/dagu_2.7.17_linux_armv7.tar.gz"
    armhf.sha256 = "8e45993dc9a9b52701d02692340c09ddc3cfca1dcdffd0efc8e77cf45f157dbb"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
