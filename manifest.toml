#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.19.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.19.0/dagu_2.19.0_linux_amd64.tar.gz"
    amd64.sha256 = "afbc2e2c46cec780c37147a19db528617b90da5cf1a875e705099269b90e49fc"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.19.0/dagu_2.19.0_linux_arm64.tar.gz"
    arm64.sha256 = "0e2af0ef6c8c917e927cf72fdf9a0ced3b59d427db2402092bf3159169057a62"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.19.0/dagu_2.19.0_linux_armv7.tar.gz"
    armhf.sha256 = "db89ae075a25b47f949503d38ccb40b1aaa69b0ab4ff68d1edded7527399984d"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
