#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.16.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.0/dagu_2.16.0_linux_amd64.tar.gz"
    amd64.sha256 = "5b7fd6332371f1b169294659d29930edf2b2d97d79e631c1d7bd495b07842070"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.0/dagu_2.16.0_linux_arm64.tar.gz"
    arm64.sha256 = "b5f63d82dad03891ea8406093e7ede5144617f14bf2e99635e72c41c6996d3a2"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.16.0/dagu_2.16.0_linux_armv7.tar.gz"
    armhf.sha256 = "873f46045b8c917182d4c5a158e6436a0922a33069611dfcdedcdf9319349849"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
