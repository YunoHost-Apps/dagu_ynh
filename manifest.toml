#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.10.4~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.4/dagu_2.10.4_linux_amd64.tar.gz"
    amd64.sha256 = "f1ed4613b5cb07c4d9d0dc9376843733a44545d4340c213bf94913a9aa65321b"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.4/dagu_2.10.4_linux_arm64.tar.gz"
    arm64.sha256 = "f63359bc7c83d8f9278848c8ff1275efe3b6cd54c6c3a7f50f8d6dab93ac7ff6"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.10.4/dagu_2.10.4_linux_armv7.tar.gz"
    armhf.sha256 = "b1d42ca34b1b56d4341e1aef38d17dc33a78ee33f7ea4533c9e413052ded1fe0"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
