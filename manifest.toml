#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.7.14~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.14/dagu_2.7.14_linux_amd64.tar.gz"
    amd64.sha256 = "5fa21e06a308dd9f2ee666638ac4415e39770ac461dfdc4a51b1b0201296dc2e"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.14/dagu_2.7.14_linux_arm64.tar.gz"
    arm64.sha256 = "5f738350265518ba049a407d80af21a89bca2075df0584a72be170680ddb2166"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.14/dagu_2.7.14_linux_armv7.tar.gz"
    armhf.sha256 = "0804ae49d3c5e4f77e22ab84eb0e8159ca5999349bd6643ee6fac0bcdddcc22f"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
