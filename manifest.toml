#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.8.3~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.8.3/dagu_2.8.3_linux_amd64.tar.gz"
    amd64.sha256 = "ec2ddb8c623cf2110198e62e50476ddd029f346b9d59db524590f5bb897aab08"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.8.3/dagu_2.8.3_linux_arm64.tar.gz"
    arm64.sha256 = "e9cc1da9c5ba45a7e556f73d008b5dc4478003cd9212c185ee3891be5aeb051f"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.8.3/dagu_2.8.3_linux_armv7.tar.gz"
    armhf.sha256 = "a3cc1931c45e0fa9803c11f96ac26620c43a8a2b67ea1be38dc88eff40012978"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
