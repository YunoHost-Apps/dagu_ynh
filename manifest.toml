#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.23.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.23.0/dagu_2.23.0_linux_amd64.tar.gz"
    amd64.sha256 = "ab2199c6a44a9734dc67529b842ff115d2ab30d4a34e1ee290633232fd1ce3c1"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.23.0/dagu_2.23.0_linux_arm64.tar.gz"
    arm64.sha256 = "e01c3eb0727002d3df2d7c867024120421a40096de6ef27bd8564284763e2755"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.23.0/dagu_2.23.0_linux_armv7.tar.gz"
    armhf.sha256 = "af8fca2966b850d7c41d56598955a98f77c8628c1d75d4646e38e1fa4398a032"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
