#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.27.0~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.27.0/dagu_2.27.0_linux_amd64.tar.gz"
    amd64.sha256 = "a9045768c9777d0b938585696e0491bc0ce46fbeb0419989b34fde63a0cc6f85"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.27.0/dagu_2.27.0_linux_arm64.tar.gz"
    arm64.sha256 = "be66823266538330e440352658304c1261047a8e58b83a6b66c098a86629d2da"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.27.0/dagu_2.27.0_linux_armv7.tar.gz"
    armhf.sha256 = "9a4dd9803173bf4f866d21b3dddb0b19949a087e247155ac5f0c3589c53a9203"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    api.url = "/api"
    api.auth_header = false
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true
    
    [resources.ports]
