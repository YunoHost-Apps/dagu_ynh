#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.17.2~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.17.2/dagu_2.17.2_linux_amd64.tar.gz"
    amd64.sha256 = "404f61946d57896f0c8aa90a95d925d32de33beaae0492a744473bc11de2b463"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.17.2/dagu_2.17.2_linux_arm64.tar.gz"
    arm64.sha256 = "cee22e63cfcc074e21d7146b514756d3665d495bb1f4a039d663ca59f99a9612"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.17.2/dagu_2.17.2_linux_armv7.tar.gz"
    armhf.sha256 = "0f3ba4a98ab075c80654f49feac97608f71b58f904ebf7b89aba559835cd125b"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
