#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.7.16~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.16/dagu_2.7.16_linux_amd64.tar.gz"
    amd64.sha256 = "6bfe51071b78d58ba32c667004147fc8a162061793eba3aa25626f83d4959a5f"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.16/dagu_2.7.16_linux_arm64.tar.gz"
    arm64.sha256 = "8361c02911420f6d84edc1594fa917b8f849074b867141aa2f9c5d567f523757"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.16/dagu_2.7.16_linux_armv7.tar.gz"
    armhf.sha256 = "f35a7784f86d80d02afa16215465b09224a4b108f40cf108ec8a27ceb8007f3c"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
