#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.8.2~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.8.2/dagu_2.8.2_linux_amd64.tar.gz"
    amd64.sha256 = "d94ddbe6e72e0f8b24a99e5c98ebcf077e6098327e206bafef2eb944371547f6"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.8.2/dagu_2.8.2_linux_arm64.tar.gz"
    arm64.sha256 = "4ae2eb60c308ca9e5b250b4e17753cbad709e439211dea9be4b3017838f4cd7b"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.8.2/dagu_2.8.2_linux_armv7.tar.gz"
    armhf.sha256 = "908346c484ea1e29c1779a2b9472e318bd7577f6a7d1673cd87779a0e0ffbd3a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
