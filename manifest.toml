#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.22.3~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.22.3/dagu_2.22.3_linux_amd64.tar.gz"
    amd64.sha256 = "6e957188d80eea68eab970d0418782382e9ba0894fd501710e65c9d628e2a212"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.22.3/dagu_2.22.3_linux_arm64.tar.gz"
    arm64.sha256 = "1e192054dfbdfef87de028263b0cd9fa7107d7a45be38f55dbf51c7afb069575"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.22.3/dagu_2.22.3_linux_armv7.tar.gz"
    armhf.sha256 = "80b7ceddf0399c9b5647a52f2e1d028b586fbbc7808673ea9603d414d16736af"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
