#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.7.7~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.7/dagu_2.7.7_linux_amd64.tar.gz"
    amd64.sha256 = "e274ce9f3125098c023b3c2dd9bb10d3c230e6334c1a52cdfd33f29942c35e7f"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.7/dagu_2.7.7_linux_arm64.tar.gz"
    arm64.sha256 = "42166756aaa39a6245896cd8efb848a9253b7a509940abe6b72cb71ab5541ddb"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.7/dagu_2.7.7_linux_armv7.tar.gz"
    armhf.sha256 = "b56950915cf009f9b011ba94c1a2a4de0a9d9337aa97229006d41448988a71aa"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
