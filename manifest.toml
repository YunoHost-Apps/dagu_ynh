#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.7.9~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.9/dagu_2.7.9_linux_amd64.tar.gz"
    amd64.sha256 = "285a7246b40e8d89443527377b63685e188a22681b640fd00fa908de37e69994"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.9/dagu_2.7.9_linux_arm64.tar.gz"
    arm64.sha256 = "cb80b88c832126e162cca91f7e88a5349d896c1398a53932a04462db43e35476"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.9/dagu_2.7.9_linux_armv7.tar.gz"
    armhf.sha256 = "8ebf7e851d73f3426c0a7d5a8d03801ade954075767142262037bdaf9e10b81a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
