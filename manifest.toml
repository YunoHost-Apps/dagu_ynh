#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.7.12~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.12/dagu_2.7.12_linux_amd64.tar.gz"
    amd64.sha256 = "82a99e9d3b1d3c2aea9041003787bbf6c73cf84952f8d07bb648d1ea4f4b7cb0"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.12/dagu_2.7.12_linux_arm64.tar.gz"
    arm64.sha256 = "d7ee50623ed015bc64a0afcea1a3238d0728f9ba9df4e5e8735de81967eeed31"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.7.12/dagu_2.7.12_linux_armv7.tar.gz"
    armhf.sha256 = "f63ee753873cf04c16b7043f8547f4eaa9c56278e0cf36f83d40e4470b207e56"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
