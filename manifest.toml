#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dagu"
name = "Dagu"
description.en = "Cron alternative that comes with a Web UI"
description.fr = "Alternative à Cron fournie avec une interface utilisateur Web"

version = "2.22.2~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
admindoc = "https://docs.daguit.dev/"
code = "https://github.com/dagu-org/dagu"
website = "https://dagu.cloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/dagucloud/dagu/releases/download/v2.22.2/dagu_2.22.2_linux_amd64.tar.gz"
    amd64.sha256 = "e10a6700a4df998fa4c06838d91f04b14aac5f3e0328eac0962109886fbc470b"
    arm64.url = "https://github.com/dagucloud/dagu/releases/download/v2.22.2/dagu_2.22.2_linux_arm64.tar.gz"
    arm64.sha256 = "6adc3050515676ff38c358cb3e812d449e18aea1f4d7b37ef666b20c0b91ed21"
    armhf.url = "https://github.com/dagucloud/dagu/releases/download/v2.22.2/dagu_2.22.2_linux_armv7.tar.gz"
    armhf.sha256 = "eaacd042c819595422f4f02c0ba40588bc79263ee4e442f659eef6c17dfddd63"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^dagu_.*_linux_amd64.tar.gz$"
    autoupdate.asset.armhf = "^dagu_.*_linux_armv7.tar.gz$"
    autoupdate.asset.arm64 = "^dagu_.*_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
